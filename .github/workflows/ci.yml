name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Require 100% coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "coverage: $total"
          [ "$total" = "100.0%" ]

  proto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: Require 100% coverage (hand-written code; generated coordinatexpb excluded)
        run: |
          go test -race -coverpkg=. -coverprofile=coverage.out .
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "coverage: $total"
          [ "$total" = "100.0%" ]

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: |
          for f in FuzzParse FuzzDecodeGeohash FuzzDecodePolyline FuzzParseGeometry FuzzScan; do
            go test -run='^$' -fuzz="^$f\$" -fuzztime=20s . || exit 1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
